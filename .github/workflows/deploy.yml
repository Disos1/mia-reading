name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Built WITHOUT Supabase credentials on purpose. The app is offline-first:
      # with no VITE_SUPABASE_URL it skips the auth gate entirely and stores
      # everything on the device, which is how Mia uses it today. The old
      # `mia-learning` project was deleted (its host no longer resolves), so
      # injecting those secrets would put an un-passable sign-in screen in front
      # of her. When sync arrives it belongs to the mia-math project — see
      # ENV_NOTE.md — and this step gets its env block back with the new values.
      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
